name: Build feeds
# Fallback for feeds that block browsers and when you don't run the Worker: pre-builds data/feeds/*.json hourly.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-feeds.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feeds
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "chore: refresh pre-built feeds"; git push; fi
